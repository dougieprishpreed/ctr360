; Copy to ctr360.ini beside default.xex. Restart the game after editing.
; Missing/invalid settings keep the defaults. Names are case sensitive.
[graphics]
; 1 targets 60 FPS rendering in single-player races; 0 uses 30 FPS rendering.
interpolation = 1
texture_filter = 1
edge_aa = 1

; Map each original PlayStation button to a physical Xbox 360 control.
; Applies to all controllers. Defaults preserve the original CTR layout.
; Controls: A B X Y LB RB LT RT LS RS START BACK
;           DPAD_UP DPAD_DOWN DPAD_LEFT DPAD_RIGHT NONE
; Axes: LEFT_X LEFT_Y RIGHT_X RIGHT_Y (prefix - to invert).
; The physical Back+Start exit shortcut remains available.
[controls]
cross = A
circle = B
square = X
triangle = Y
l1 = LB
r1 = RB
l2 = LT
r2 = RT
l3 = LS
r3 = RS
start = START
select = BACK
dpad_up = DPAD_UP
dpad_down = DPAD_DOWN
dpad_left = DPAD_LEFT
dpad_right = DPAD_RIGHT
left_x = LEFT_X
left_y = -LEFT_Y
right_x = RIGHT_X
right_y = -RIGHT_Y
