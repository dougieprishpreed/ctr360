name: xSDK build

# Builds default.xex with the open xSDK toolchain at the pinned dependency
# revisions in tools/xsdk/bootstrap.sh. The game disc is never involved: the
# artifact is the executable only, to stage with your own converted disc.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev \
            curl xz-utils patch python3 cmake ninja-build git ca-certificates

      # The compiler, the pinned SDK checkouts and the shader compiler take
      # most of the build time; the cache key follows the pins.
      - name: Restore pinned toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: |
            build-xsdk/toolchain
            build-xsdk/deps/xsdk
            build-xsdk/deps/vulkan4xenon
            build-xsdk/glslang
          key: xsdk-toolchain-v1-${{ runner.os }}-${{ hashFiles('tools/xsdk/bootstrap.sh') }}

      - name: Build pinned toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          JOBS=$(nproc) bash tools/xsdk/bootstrap.sh
          mkdir -p build-xsdk/glslang
          cp build-xsdk/deps/glslang-xenon/build-host/StandAlone/glslang build-xsdk/glslang/
          rm -rf build-xsdk/deps/toolchain-work build-xsdk/deps/glslang-xenon

      - name: Build default.xex
        run: |
          export XSDK="$PWD/build-xsdk/deps/xsdk"
          export VULKAN4XENON="$PWD/build-xsdk/deps/vulkan4xenon"
          export XSDK_TOOLCHAIN="$PWD/build-xsdk/toolchain"
          export XSDK_GLSLANG="$PWD/build-xsdk/glslang/glslang"
          JOBS=$(nproc) bash tools/xsdk/build.sh

      - name: Package
        run: |
          mkdir -p dist/licenses
          cp build-xsdk/output/default.xex dist/
          cp build-xsdk/output/licenses/* dist/licenses/
          cp LICENSE dist/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.txt
          cp tools/ctr360/ctr360.example.ini dist/
          (cd dist && sha256sum default.xex | tee default.xex.sha256)

      # The release's two zips, the Homebrew App Store package (made by xsdk's store_catalogue.py)
      # and the one for installing by hand with the converter, and the store's catalogue entry.
      # Releases are published by hand from this artifact; upload the zips as they are.
      - name: Package the release
        run: |
          python3 tools/xsdk/package.py --dist dist --out release --xsdk build-xsdk/deps/xsdk
          rm -rf release/work

      - uses: actions/upload-artifact@v4
        with:
          name: ctr360-xex
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ctr360-release
          path: release/
